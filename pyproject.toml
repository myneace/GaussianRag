[project]
name = "gaussian-rag"
version = "0.1.0"
description = "Probabilistic retrieval-augmented generation on statistical information manifolds"
readme = "README.md"
license = { text = "AGPL-3.0" }
keywords = ["rag", "retrieval", "gaussian", "manifold", "nlp", "llm", "information-geometry"]
authors = [{ name = "Manifold Project" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "pydantic>=2.0",
  "sentence-transformers>=3.0",
  "openai>=2.33.0",
]

[project.optional-dependencies]
cloud = [
  "httpx>=0.27",
]
dashboard = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "anyio>=4.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
]
research = [
  "torch>=2.2",
]

[project.scripts]
gaussian-rag = "gaussian_rag.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
gaussian_rag = ["py.typed"]

[tool.setuptools.packages.find]
include = ["gaussian_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
