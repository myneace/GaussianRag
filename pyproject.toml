[project]
name = "gaussian-rag"
version = "0.1.0"
description = "Probabilistic retrieval-augmented generation on information manifolds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0.1",
  "httpx>=0.27",
  "sentence-transformers>=3.0",
  "openai>=2.33.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]
research = [
  "torch>=2.2",
]

[project.scripts]
gaussian-rag = "gaussian_rag.main:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["gaussian_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
